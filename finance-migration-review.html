<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>财务数据整理与修改 — 通跃检测内部系统</title>
  <style>
    :root{--navy:#17365d;--blue:#2563a8;--canvas:#f3f6fa;--surface:#fff;--line:#dce5f0;--soft:#edf2f7;--text:#172033;--muted:#667085;--green:#16835b;--amber:#c27a0a;--red:#c83d4a;--shadow:0 3px 14px rgba(23,54,93,.08)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:14px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif;background:var(--canvas);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.hidden{display:none!important}
    :focus-visible{outline:3px solid rgba(37,99,168,.2);outline-offset:1px}.topbar{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:80}.brand{font-size:20px;font-weight:700}.brand span{opacity:.6;padding:0 8px}.top-actions,.page-actions,.filters,.batch,.pager{display:flex;align-items:center;gap:10px}.top-link,.btn{min-height:36px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.top-link{background:transparent;color:#fff;border-color:transparent}.top-link:hover{background:rgba(255,255,255,.09)}.top-file{border-color:rgba(255,255,255,.75)}.btn:hover{border-color:#aec1d8;background:#f8fbff}.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.btn-primary:hover{background:#1d5590}.btn-danger{color:var(--red);border-color:#e8aeb4}.btn-danger:hover{background:#fff4f5}.btn-success{color:var(--green);border-color:#a9d3c3}.btn-sm{min-height:30px;padding:4px 9px;font-size:12px}.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    main{max-width:1560px;margin:0 auto;padding:14px 20px 32px}.notice{min-height:48px;border:1px solid #c5d9f1;background:#eef6ff;color:#345475;display:flex;align-items:center;gap:10px;padding:9px 13px;margin-bottom:18px}.notice strong{color:var(--navy)}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}.page-head h1{font-size:27px;margin:0;color:#111a2b}.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:16px}.metric{min-height:100px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric-label{color:#4f5c72;margin-bottom:5px}.metric-value{font-size:27px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}.metric.ready .metric-value{color:var(--green)}.metric.review .metric-value{color:var(--amber)}.metric.reject .metric-value{color:var(--red)}
    .filters{background:#fff;border:1px solid var(--line);padding:11px 13px;margin-bottom:12px;flex-wrap:wrap}.field{display:flex;align-items:center;gap:7px;white-space:nowrap}.field label{color:#475467}.control{height:36px;border:1px solid #cfd9e6;background:#fff;padding:0 10px;color:var(--text);min-width:150px}.search{min-width:280px;flex:1}.checkbox{display:flex;align-items:center;gap:7px}.checkbox input,.row-check{width:17px;height:17px;accent-color:var(--blue)}
    .table-panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.batch{min-height:50px;padding:8px 13px;border-bottom:1px solid var(--line)}.batch .count{margin-right:8px;color:#475467}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1220px;font-size:13px}th{background:#f6f8fb;color:#3e4b61;font-weight:700;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}tbody tr:hover{background:#fafcff}tbody tr.selected{background:#edf6ff}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.direction-in{color:var(--green);font-weight:700}.direction-out{color:var(--red);font-weight:700}.tag{display:inline-block;border:1px solid;padding:2px 6px;font-size:11px;margin:1px 3px 1px 0;white-space:nowrap}.tag.warning{color:#956108;border-color:#edcc8e;background:#fff8e8}.tag.error{color:#a62d38;border-color:#efbdc2;background:#fff2f3}.tag.ok{color:#12664a;border-color:#b7dece;background:#edf9f4}.tag.pending{color:#195ba6;border-color:#bad4f4;background:#eff6ff}.issues{max-width:250px}.action-link{border:0;background:transparent;color:var(--blue);padding:3px;font-weight:700}.action-link:hover{text-decoration:underline}.table-empty{text-align:center!important;color:var(--muted);padding:42px!important}.panel-foot{min-height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border-top:1px solid var(--line)}.pager button{min-width:32px;height:32px;border:1px solid var(--line);background:#fff;color:#344054}.pager button.active{color:#fff;background:var(--blue);border-color:var(--blue)}
    footer{height:42px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#56647a;font-size:12px}.drawer-backdrop{position:fixed;inset:0;background:rgba(12,28,50,.45);z-index:150;display:none}.drawer-backdrop.open{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(650px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(13,35,65,.2)}.drawer-head{min-height:60px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-head h2{font-size:19px;margin:0}.close{width:36px;height:36px;border:0;background:transparent;font-size:23px;color:#667085}.drawer-alert{margin:14px 18px 0;padding:10px 12px;border:1px solid #eed19b;background:#fff8e8;color:#865708;font-weight:700}.drawer-body{padding:0 18px 24px;overflow:auto}.section-title{font-size:15px;margin:18px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line)}.source-item{display:grid;grid-template-columns:90px 1fr;min-height:38px;border-bottom:1px solid var(--soft)}.source-item:nth-child(odd){border-right:1px solid var(--soft)}.source-item span{padding:8px}.source-item .label{background:#f7f9fc;color:#59667b}.source-item .value{word-break:break-word}.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-field{display:flex;flex-direction:column;gap:5px}.form-field.full{grid-column:1/-1}.form-field label{font-size:12px;font-weight:700;color:#475467}.required:after{content:" *";color:var(--red)}.input{width:100%;min-height:36px;border:1px solid #cfd9e6;padding:7px 9px;background:#fff}.calc-check{border-left:3px solid var(--amber);background:#fff9ec;color:#7f560a;padding:9px 11px;margin-top:12px}.drawer-note{color:#5e6c82;font-size:12px;margin-top:8px}.drawer-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:9px;justify-content:space-between;background:#fff}.drawer-foot .center{display:flex;gap:9px}.modal-backdrop{position:fixed;inset:0;background:rgba(12,28,50,.48);z-index:220;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(480px,100%);background:#fff;box-shadow:0 18px 60px rgba(12,28,50,.3)}.modal h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:18px}.modal-body{padding:16px 18px}.modal-actions{border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:flex-end;gap:9px}.toast-stack{position:fixed;top:76px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px}.toast{width:min(380px,calc(100vw - 36px));background:#fff;border-left:4px solid var(--green);box-shadow:0 8px 28px rgba(13,35,65,.2);padding:11px 13px}.toast.error{border-left-color:var(--red)}
    @media(max-width:900px){.topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:9px 14px}.brand{font-size:17px}.top-actions{gap:4px}.top-link{padding:5px 7px}.page-head{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(3,1fr)}.metric{min-height:78px;border-bottom:1px solid var(--line)}.filters{align-items:stretch}.field{flex:1 1 220px}.control{width:100%}.search{min-width:0}.drawer{width:min(720px,100%)}}
    @media(max-width:620px){main{padding:12px 9px 24px}.brand span{display:none}.top-actions .top-link:not(.top-file){display:none}.page-head h1{font-size:23px}.page-actions{width:100%;flex-wrap:wrap}.summary{grid-template-columns:repeat(2,1fr)}.metric{min-height:72px}.metric-value{font-size:22px}.filters{display:block}.field,.checkbox{margin-bottom:9px}.field{display:block}.field label{display:block;margin-bottom:4px}.control{width:100%}.batch{flex-wrap:wrap}.source-grid,.edit-grid{grid-template-columns:1fr}.source-item:nth-child(odd){border-right:0}.form-field.full{grid-column:auto}.drawer-foot{flex-wrap:wrap}.drawer-foot .center{order:-1;width:100%}.drawer-foot .center .btn{flex:1}.panel-foot{align-items:flex-start;flex-direction:column;gap:9px}.toast-stack{left:9px;right:9px}.toast{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">通跃检测 <span>·</span> 财务数据整理与修改</div><div class="top-actions"><a class="top-link" href="finance-management.html">返回财务中心</a><a class="top-link" href="orders.html">返回原系统</a><label class="top-link top-file" for="previewFile">选择本地预览文件</label><input class="file-input" id="previewFile" type="file" accept="application/json,.json"></div></header>
  <main>
    <div class="notice"><span>ⓘ</span><span><strong>可直接修改并保存，无需双重复核；</strong>所有修改保存在当前浏览器。导入的本地文件不会发送到任何外部服务。</span></div>
    <div class="page-head"><div><h1>迁移数据整理</h1><p id="sourceInfo">尚未导入迁移预览文件，请选择桌面的“财务迁移预览.json”。</p></div><div class="page-actions"><button class="btn btn-danger" id="clearReviewBtn">清空已保存修改</button><button class="btn" id="exportBtn">导出整理结果</button><button class="btn btn-primary" disabled title="正式写入数据库功能尚未开放">进入正式导入</button></div></div>
    <section class="summary" aria-label="迁移数据统计"><div class="metric"><span class="metric-label">总记录</span><span class="metric-value" id="totalMetric">0</span></div><div class="metric ready"><span class="metric-label">可直接使用</span><span class="metric-value" id="readyMetric">0</span></div><div class="metric review"><span class="metric-label">建议检查</span><span class="metric-value" id="reviewMetric">0</span></div><div class="metric reject"><span class="metric-label">已排除</span><span class="metric-value" id="rejectMetric">0</span></div><div class="metric"><span class="metric-label">处理进度</span><span class="metric-value" id="progressMetric">0%</span></div></section>
    <section class="filters" aria-label="筛选条件"><div class="field"><label for="statusFilter">状态</label><select id="statusFilter" class="control"><option value="">全部</option><option value="pending">未处理</option><option value="confirmed">已保存</option><option value="rejected">已排除</option></select></div><div class="field"><label for="issueFilter">问题类型</label><select id="issueFilter" class="control"><option value="">全部</option></select></div><div class="field search"><label for="searchInput">搜索</label><input id="searchInput" class="control" placeholder="请输入发票号、摘要、原类目或金额"></div><label class="checkbox"><input id="pendingOnly" type="checkbox">仅显示未处理</label><button class="btn btn-sm" id="resetFilters">重置</button></section>
    <section class="table-panel"><div class="batch"><span class="count">已选择 <strong id="selectedCount">0</strong> 项</span><button class="btn btn-sm btn-success" id="batchConfirm" disabled>批量保存</button><button class="btn btn-sm btn-danger" id="batchReject" disabled>批量排除</button></div><div class="table-wrap"><table><thead><tr><th><input class="row-check" id="selectPage" type="checkbox" aria-label="选择本页"></th><th>Excel行</th><th>日期</th><th>收支</th><th>原类目</th><th>迁移类目</th><th class="num">含税金额</th><th>发票</th><th>问题</th><th>处理状态</th><th>操作</th></tr></thead><tbody id="reviewRows"></tbody></table></div><div class="panel-foot"><span id="resultCount">共 0 条</span><div class="pager" id="pager"></div></div></section>
  </main>
  <footer>本地整理模式 · 未连接数据库</footer>

    <div class="drawer-backdrop" id="reviewDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><aside class="drawer"><div class="drawer-head"><h2 id="drawerTitle">查看与修改 Excel 行</h2><button class="close" id="closeDrawer" aria-label="关闭">×</button></div><div class="drawer-alert" id="drawerAlert">请检查提示项</div><div class="drawer-body"><h3 class="section-title">原始记录</h3><div class="source-grid" id="sourceGrid"></div><h3 class="section-title">修改后数据</h3><form class="edit-grid" id="reviewForm"><div class="form-field"><label class="required" for="editDate">日期</label><input class="input" id="editDate" type="date" required></div><div class="form-field"><label class="required" for="editDirection">收支方向</label><select class="input" id="editDirection"><option value="income">收入</option><option value="expense">支出</option></select></div><div class="form-field"><label class="required" for="editNature">资金性质</label><select class="input" id="editNature"><option value="operating">经营收支</option><option value="dividend">分红</option><option value="loan_receipt">借款本金</option><option value="loan_repayment">偿还本金</option><option value="interest">利息</option><option value="tax_payment">税款</option><option value="other">其他</option></select></div><div class="form-field"><label class="required" for="editCategory">迁移类目</label><input class="input" id="editCategory" maxlength="80" required></div><div class="form-field"><label class="required" for="editGross">含税金额（元）</label><input class="input" id="editGross" type="number" min="0.01" step="0.01" required></div><div class="form-field"><label class="required" for="editRate">税率（%）</label><input class="input" id="editRate" type="number" min="0" max="100" step="0.01" required></div><div class="form-field"><label class="required" for="editTax">税额（元）</label><input class="input" id="editTax" type="number" min="0" step="0.01" required></div><div class="form-field"><label for="editInvoices">发票号码</label><input class="input" id="editInvoices" maxlength="500"></div><div class="form-field full"><label class="required" for="editParty">对方单位／摘要</label><input class="input" id="editParty" maxlength="160" required></div></form><div class="calc-check" id="calcCheck">正在检查价税关系…</div><h3 class="section-title">修改备注（选填）</h3><div class="form-field"><label for="reviewNote">备注</label><textarea class="input" id="reviewNote" rows="3" maxlength="500" placeholder="可填写修改原因或凭证说明"></textarea><span class="drawer-note">保存后仍可再次打开修改；当前不会写入数据库。</span></div></div><div class="drawer-foot"><button class="btn" id="prevRow">上一条</button><div class="center"><button class="btn btn-danger" id="rejectRow">排除此行</button><button class="btn btn-primary" id="confirmRow">保存修改</button></div><button class="btn" id="nextRow">下一条</button></div></aside></div>
  <div class="modal-backdrop" id="rejectModal" role="dialog" aria-modal="true" aria-labelledby="rejectTitle"><div class="modal"><h2 id="rejectTitle">批量排除</h2><div class="modal-body"><label class="required" for="batchReason">排除原因</label><textarea class="input" id="batchReason" rows="4" maxlength="500" placeholder="该说明将应用于所有选中记录"></textarea></div><div class="modal-actions"><button class="btn" id="cancelBatchReject">取消</button><button class="btn btn-danger" id="confirmBatchReject">确认排除</button></div></div></div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <script>
  (()=>{'use strict';
    const DECISION_KEY='ty_finance_migration_decisions_v04',DECISION_PREFIX='ty_finance_migration_decisions_',PAGE_SIZE=10,issueLabels={tax_rate_sentinel_1:'税率值1',calculated_tax_mismatch:'税额计算差异',gross_tax_mismatch:'价税不一致',duplicate_invoice_number:'重复票号',date_outlier:'异常日期',invalid_date:'日期无效',invoice_type_without_number:'有票型无票号',invoice_number_without_type:'有票号无票型',direction_remittance_conflict:'收支方向冲突',special_category_review:'特殊类目'};
    let state={rows:[],meta:{row_count:0,ready_count:0,review_count:0,rejected_count:0},sourceId:'empty',sourceName:'未导入文件',decisions:{},selected:new Set(),page:1,current:null};
    function loadDecisions(id){try{return JSON.parse(localStorage.getItem(DECISION_KEY+':'+id)||'{}')}catch{return{}}}function saveDecisions(){try{localStorage.setItem(DECISION_KEY+':'+state.sourceId,JSON.stringify(state.decisions))}catch{toast('浏览器本地保存失败','error')}}
    const $=id=>document.getElementById(id),el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
    function decision(row){return state.decisions[row.excel_row]||null}function statusOf(row){return decision(row)?.status||'pending'}function money(cents){return(Number(cents||0)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function filteredRows(){const status=$('pendingOnly').checked?'pending':$('statusFilter').value,issue=$('issueFilter').value,q=$('searchInput').value.trim().toLowerCase();return state.rows.filter(row=>(!status||statusOf(row)===status)&&(!issue||row.issues.some(item=>item.code===issue))&&(!q||[row.excel_row,row.transaction?.occurred_on,row.transaction?.original_category,row.transaction?.category_name_snapshot,row.transaction?.counterparty_name,row.transaction?.gross_cents,...(row.invoice_numbers||[]).map(i=>i.key)].some(value=>String(value??'').toLowerCase().includes(q))))}
    function render(){renderSummary();renderIssueOptions();const rows=filteredRows(),pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));state.page=Math.min(state.page,pages);const start=(state.page-1)*PAGE_SIZE,pageRows=rows.slice(start,start+PAGE_SIZE),body=$('reviewRows');body.replaceChildren();pageRows.forEach(row=>body.appendChild(renderRow(row)));if(!pageRows.length){const tr=el('tr'),td=el('td','table-empty','没有符合条件的记录');td.colSpan=11;tr.appendChild(td);body.appendChild(tr)}$('resultCount').textContent='共 '+rows.length+' 条';renderPager(pages);renderBatch();$('selectPage').checked=pageRows.length>0&&pageRows.every(row=>state.selected.has(row.excel_row));$('selectPage').indeterminate=pageRows.some(row=>state.selected.has(row.excel_row))&&!$('selectPage').checked}
    function renderSummary(){const total=state.meta.row_count||state.rows.length,confirmed=Object.values(state.decisions).filter(d=>d.status==='confirmed').length,rejected=Object.values(state.decisions).filter(d=>d.status==='rejected').length,processed=confirmed+rejected;$('totalMetric').textContent=total;$('readyMetric').textContent=state.meta.ready_count??state.rows.filter(r=>r.import_status==='ready').length;$('reviewMetric').textContent=state.meta.review_count??state.rows.filter(r=>r.import_status==='review').length;$('rejectMetric').textContent=(state.meta.rejected_count||0)+rejected;$('progressMetric').textContent=Math.round(processed/Math.max(1,total)*100)+'%'}
    function renderIssueOptions(){const select=$('issueFilter'),current=select.value,codes=[...new Set(state.rows.flatMap(row=>row.issues.map(item=>item.code)))].sort();select.replaceChildren(new Option('全部',''));codes.forEach(code=>select.appendChild(new Option(issueLabels[code]||code,code)));select.value=codes.includes(current)?current:''}
    function renderRow(row){const tr=el('tr',state.selected.has(row.excel_row)?'selected':'');const checkCell=el('td'),check=el('input','row-check');check.type='checkbox';check.checked=state.selected.has(row.excel_row);check.setAttribute('aria-label','选择 Excel 第'+row.excel_row+'行');check.addEventListener('change',()=>{check.checked?state.selected.add(row.excel_row):state.selected.delete(row.excel_row);render()});checkCell.appendChild(check);tr.appendChild(checkCell);cell(tr,row.excel_row);cell(tr,row.transaction?.occurred_on||'—');cell(tr,row.transaction?.direction==='income'?'收入':'支出',row.transaction?.direction==='income'?'direction-in':'direction-out');cell(tr,row.transaction?.original_category||'—');cell(tr,row.transaction?.category_name_snapshot||'—');cell(tr,money(row.transaction?.gross_cents),'num');cell(tr,(row.invoice_numbers||[]).map(i=>i.key).join('、')||'—');const issueCell=el('td','issues');if(row.issues?.length)row.issues.forEach(item=>issueCell.appendChild(el('span','tag '+(item.level==='error'?'error':'warning'),issueLabels[item.code]||item.code)));else issueCell.appendChild(el('span','tag ok','无'));tr.appendChild(issueCell);const st=statusOf(row),statusCell=el('td');statusCell.appendChild(el('span','tag '+(st==='confirmed'?'ok':st==='rejected'?'error':'pending'),st==='confirmed'?'已保存':st==='rejected'?'已排除':'未处理'));tr.appendChild(statusCell);const op=el('td'),btn=el('button','action-link','查看/修改');btn.addEventListener('click',()=>openDrawer(row));op.appendChild(btn);tr.appendChild(op);return tr}
    function cell(tr,text,cls=''){tr.appendChild(el('td',cls,String(text??'')))}function renderPager(pages){const wrap=$('pager');wrap.replaceChildren();for(let page=1;page<=pages;page++){if(pages>8&&page>3&&page<pages-1){if(page===4)wrap.appendChild(el('span','','…'));continue}const b=el('button',page===state.page?'active':'',String(page));b.addEventListener('click',()=>{state.page=page;render()});wrap.appendChild(b)}}
    function renderBatch(){$('selectedCount').textContent=state.selected.size;$('batchConfirm').disabled=!state.selected.size;$('batchReject').disabled=!state.selected.size}
    function openDrawer(row){state.current=row;const saved=decision(row);$('drawerTitle').textContent='查看与修改 Excel 第'+row.excel_row+'行';$('drawerAlert').textContent=row.issues?.length?row.issues.map(i=>issueLabels[i.code]||i.code).join(' · ')+' · 建议检查后保存':'未发现结构性问题，可直接保存';const grid=$('sourceGrid');grid.replaceChildren();const source=row.source_record||{};['日期','进出','类目','分配','金额','税率','税额','合同额','发票','发票号','明细','汇款','备注'].forEach(label=>{const item=el('div','source-item');item.append(el('span','label',label),el('span','value',displaySource(source[label])));grid.appendChild(item)});const t={...row.transaction,...(saved?.edits||{})};$('editDate').value=t.occurred_on||'';$('editDirection').value=t.direction||'expense';$('editNature').value=t.cash_nature||'operating';$('editCategory').value=t.category_name_snapshot||'';$('editGross').value=((t.gross_cents||0)/100).toFixed(2);$('editRate').value=((t.tax_rate_bps||0)/100).toFixed(2);$('editTax').value=((t.tax_cents||0)/100).toFixed(2);$('editInvoices').value=(saved?.invoice_numbers||(row.invoice_numbers||[]).map(i=>i.key)).join('、');$('editParty').value=t.counterparty_name||'';$('reviewNote').value=saved?.note||'';updateCalc();$('reviewDrawer').classList.add('open');setTimeout(()=>$('editDate').focus(),0)}
    function displaySource(value){if(value===null||value===undefined||value==='')return'—';return String(value)}function collectEdits(){return{occurred_on:$('editDate').value,direction:$('editDirection').value,cash_nature:$('editNature').value,category_name_snapshot:$('editCategory').value.trim(),gross_cents:Math.round(Number($('editGross').value)*100),tax_rate_bps:Math.round(Number($('editRate').value)*100),tax_cents:Math.round(Number($('editTax').value)*100),net_cents:Math.round((Number($('editGross').value)-Number($('editTax').value))*100),counterparty_name:$('editParty').value.trim()}}
    function validateReview(status){const edits=collectEdits(),note=$('reviewNote').value.trim();if(!edits.occurred_on||!edits.category_name_snapshot||!edits.counterparty_name||!Number.isFinite(edits.gross_cents)||edits.gross_cents<=0||!Number.isFinite(edits.tax_cents)||edits.tax_cents<0){toast('请完整填写日期、类目、金额和对方单位','error');return null}if(status==='rejected'&&!note){toast('排除记录时必须填写原因','error');return null}const now=new Date().toISOString();return{status,note,edits,invoice_numbers:$('editInvoices').value.split(/[,，、;；\n]+/).map(v=>v.trim()).filter(Boolean),saved_at:now,saved_by:sessionStorage.getItem('ty_user')||'本地用户',reviewed_at:now,reviewed_by:sessionStorage.getItem('ty_user')||'本地用户'}}
    function saveCurrent(status){if(!state.current)return;const result=validateReview(status);if(!result)return;state.decisions[state.current.excel_row]=result;saveDecisions();toast(status==='confirmed'?'修改已保存，可随时再次编辑':'该记录已排除');render();moveDrawer(1)}function moveDrawer(step){const rows=filteredRows(),index=rows.findIndex(r=>r.excel_row===state.current?.excel_row),next=rows[index+step];if(next)openDrawer(next);else $('reviewDrawer').classList.remove('open')}
    function updateCalc(){const gross=Math.round(Number($('editGross').value||0)*100),tax=Math.round(Number($('editTax').value||0)*100),source=state.current?.source_record||{},sourceNet=Math.round(Number(source['金额']||0)*100),sourceGross=Math.round(Number(source['合同额']||0)*100),difference=sourceGross?sourceNet+tax-sourceGross:0;$('calcCheck').textContent=sourceGross?'原金额 + 当前税额 与原合同额相差 '+money(difference)+' 元；迁移净额为 '+money(gross-tax)+' 元。':'迁移净额为 '+money(gross-tax)+' 元；原合同额缺失，请检查后保存。'}
    function batchConfirm(){let count=0,skipped=0;state.selected.forEach(id=>{const row=state.rows.find(r=>r.excel_row===id);if(!row)return;if(row.issues?.length){skipped++;return}const now=new Date().toISOString();state.decisions[id]={status:'confirmed',note:'批量保存：未发现结构性问题',edits:row.transaction,invoice_numbers:(row.invoice_numbers||[]).map(i=>i.key),saved_at:now,saved_by:sessionStorage.getItem('ty_user')||'本地用户',reviewed_at:now,reviewed_by:sessionStorage.getItem('ty_user')||'本地用户'};count++});saveDecisions();state.selected.clear();render();toast('已保存 '+count+' 条；'+skipped+' 条有提示，请打开检查',skipped?'error':'success')}
    function openRejectModal(){$('batchReason').value='';$('rejectModal').classList.add('open');setTimeout(()=>$('batchReason').focus(),0)}function confirmBatchReject(){const reason=$('batchReason').value.trim();if(!reason){toast('请填写批量排除原因','error');return}state.selected.forEach(id=>{const now=new Date().toISOString();state.decisions[id]={status:'rejected',note:reason,edits:state.rows.find(r=>r.excel_row===id)?.transaction||{},invoice_numbers:[],saved_at:now,saved_by:sessionStorage.getItem('ty_user')||'本地用户',reviewed_at:now,reviewed_by:sessionStorage.getItem('ty_user')||'本地用户'}});saveDecisions();const count=state.selected.size;state.selected.clear();$('rejectModal').classList.remove('open');render();toast('已排除 '+count+' 条')}
    async function importPreview(file){if(!file)return;if(file.size>10*1024*1024){toast('预览文件不能超过 10MB','error');return}let report;try{report=JSON.parse(await file.text())}catch{toast('文件不是有效的 JSON','error');return}if(!report||!Array.isArray(report.rows)||report.rows.length>10000||!report.rows.every(r=>Number.isInteger(r.excel_row)&&r.transaction&&Array.isArray(r.issues))){toast('文件结构不符合迁移预览格式','error');return}state.sourceId='file:'+file.name+':'+file.size+':'+file.lastModified;state.sourceName=file.name;state.rows=report.rows;state.meta={row_count:report.row_count,ready_count:report.ready_count,review_count:report.review_count,rejected_count:report.rejected_count};state.decisions=loadDecisions(state.sourceId);state.selected.clear();state.page=1;$('sourceInfo').textContent='当前文件：'+file.name+'；所有修改仅保存在本浏览器，可重复打开编辑。';render();toast('已载入 '+report.rows.length+' 条迁移预览记录')}
    function exportResults(){const entries=Object.entries(state.decisions);if(!entries.length){toast('尚无已保存的修改可导出','error');return}const saved=entries.filter(([,d])=>d.status==='confirmed').length,excluded=entries.filter(([,d])=>d.status==='rejected').length,payload={format:'tongyue-finance-migration-review-v1',workflow:'direct-edit',source_id:state.sourceId,source_name:state.sourceName,exported_at:new Date().toISOString(),summary:{total:state.rows.length,saved,excluded,confirmed:saved,rejected:excluded},decisions:Object.fromEntries(entries)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='财务迁移整理结果-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('整理结果已导出到本机')}
    function clearReviewData(){if(!window.confirm('确认清空本页面保存的全部修改并移除当前载入内容？此操作无法撤销。'))return;try{const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith(DECISION_PREFIX))keys.push(key)}keys.forEach(key=>localStorage.removeItem(key));state.rows=[];state.meta={row_count:0,ready_count:0,review_count:0,rejected_count:0};state.sourceId='empty';state.sourceName='未导入文件';state.decisions={};state.selected.clear();state.page=1;state.current=null;$('previewFile').value='';$('sourceInfo').textContent='尚未导入迁移预览文件，请重新选择桌面的“财务迁移预览.json”。';$('reviewDrawer').classList.remove('open');render();toast('已清空全部已保存修改，可以重新导入') }catch{toast('清空失败，请检查浏览器存储权限','error')}}
    function toast(message,type='success'){const n=el('div','toast '+(type==='error'?'error':''),message);$('toasts').appendChild(n);setTimeout(()=>n.remove(),3800)}
    function init(){$('statusFilter').addEventListener('change',()=>{state.page=1;render()});$('issueFilter').addEventListener('change',()=>{state.page=1;render()});$('searchInput').addEventListener('input',()=>{state.page=1;render()});$('pendingOnly').addEventListener('change',()=>{state.page=1;render()});$('resetFilters').addEventListener('click',()=>{$('statusFilter').value='';$('issueFilter').value='';$('searchInput').value='';$('pendingOnly').checked=false;state.page=1;render()});$('selectPage').addEventListener('change',e=>{const rows=filteredRows().slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE);rows.forEach(row=>e.target.checked?state.selected.add(row.excel_row):state.selected.delete(row.excel_row));render()});$('batchConfirm').addEventListener('click',batchConfirm);$('batchReject').addEventListener('click',openRejectModal);$('cancelBatchReject').addEventListener('click',()=>$('rejectModal').classList.remove('open'));$('confirmBatchReject').addEventListener('click',confirmBatchReject);$('closeDrawer').addEventListener('click',()=>$('reviewDrawer').classList.remove('open'));$('reviewDrawer').addEventListener('click',e=>{if(e.target===$('reviewDrawer'))$('reviewDrawer').classList.remove('open')});$('prevRow').addEventListener('click',()=>moveDrawer(-1));$('nextRow').addEventListener('click',()=>moveDrawer(1));$('confirmRow').addEventListener('click',()=>saveCurrent('confirmed'));$('rejectRow').addEventListener('click',()=>saveCurrent('rejected'));['editGross','editTax'].forEach(id=>$(id).addEventListener('input',updateCalc));$('previewFile').addEventListener('change',e=>importPreview(e.target.files?.[0]));$('clearReviewBtn').addEventListener('click',clearReviewData);$('exportBtn').addEventListener('click',exportResults);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('reviewDrawer').classList.remove('open');$('rejectModal').classList.remove('open')}});render()}
    window.addEventListener('error',e=>{console.error(e.error||e.message);toast('页面发生异常，本次操作没有写入数据库','error')});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  })();
